[project]
name = "mg400-base"
version = "0.1.0"
description = "Dobot MG400 base station: driver, control page with sliders and pump, CLI"
requires-python = ">=3.10"
dependencies = ["Flask>=3.0"]

[project.scripts]
mg400 = "mg400.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["mg400"]

[tool.setuptools.package-data]
mg400 = ["static/*"]
